<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orderful Transactions</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7; --fg: #1a1815; --muted: #78716c; --line: #e7e2da;
    --row-hover: rgba(0, 0, 0, 0.03); --chip-bg: rgba(120, 113, 108, 0.12);
    --good: #1a7f4b; --good-bg: rgba(34, 160, 90, 0.13);
    --bad: #b3382c; --bad-bg: rgba(214, 69, 53, 0.12);
    --warn: #8a6116; --warn-bg: rgba(212, 160, 23, 0.15);
    font-size: 14px;
  }
  :root[data-theme="dark"] {
    --bg: #0e0d0c; --fg: #f2efe9; --muted: #9c948b; --line: #29251f;
    --row-hover: rgba(255, 255, 255, 0.045);
    --good: #4fc98a; --bad: #f0806f; --warn: #dcae4a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0d0c; --fg: #f2efe9; --muted: #9c948b; --line: #29251f;
      --row-hover: rgba(255, 255, 255, 0.045);
      --good: #4fc98a; --bad: #f0806f; --warn: #dcae4a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 16px 10px;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  header .count { color: var(--muted); font-size: 13px; }
  header input {
    margin-left: auto; min-width: 160px; flex: 0 1 220px;
    padding: 6px 10px; font: inherit; font-size: 13px; color: inherit;
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    outline: none;
  }
  header input:focus { border-color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th, td { text-align: left; padding: 7px 10px; white-space: nowrap; }
  th {
    position: sticky; top: 0; background: var(--bg); z-index: 1;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  th:first-child, td:first-child { padding-left: 16px; }
  th:last-child, td:last-child { padding-right: 16px; }
  tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
  tbody tr:hover { background: var(--row-hover); }
  td.type { font-weight: 550; }
  td.type .code { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  td.party .arrow { color: var(--muted); padding: 0 4px; }
  td.date { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 550; letter-spacing: 0.01em;
    background: var(--chip-bg); color: var(--muted);
  }
  .chip.good { background: var(--good-bg); color: var(--good); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.stream { font-variant-numeric: tabular-nums; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  footer {
    padding: 9px 16px; color: var(--muted); font-size: 12px;
    display: flex; justify-content: space-between; gap: 12px;
  }
</style>
</head>
<body>
<div id="root"><div class="empty">Loading transactions…</div></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
